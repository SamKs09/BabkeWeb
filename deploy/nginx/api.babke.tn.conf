# =============================================================================
#  Babke - API vhost  (FINAL hostname)
#
#  install as : /etc/nginx/sites-available/api.babke.tn.conf
#  symlink to : /etc/nginx/sites-enabled/api.babke.tn.conf   (same basename)
#  serves     : the JSON API ONLY  ->  api.babke.tn
#  upstream   : the single babke app container, published on 127.0.0.1:4050 only
#
#  This is byte-for-byte the interim api-babke.185.172.57.237.nip.io.conf apart from server_name
#  and the log paths. Do not let the two drift.
#  DNS for api.babke.tn does not exist yet - install this file only once the
#  A record points at 185.172.57.237. See INSTALL.md, "Cutover".
#
#  ROUTING DESIGN A
#  This host exists for external/integration callers and for debugging. The
#  browser frontends do NOT use it: all 39 of their network calls are
#  root-relative and are proxied by the landing and admin vhosts themselves, so
#  every fetch stays same-origin. There is no API_BASE in the codebase.
#
#  This vhost proxies /api/ ONLY. "location /" returns 404 so the API hostname
#  can never serve the storefront, the admin HTML or repo source - the app
#  itself has express.static(__dirname) plus a catch-all that answers anything
#  with index.html, and that must not be exposed here.
#
#  ---------------------------------------------------------------------------
#  !! THIS FILE IS PLAIN HTTP ON PURPOSE - DO NOT ADD TLS BY HAND !!
#
#  There is deliberately NO listen directive anywhere below; nginx implicitly
#  binds *:80 for a server block that declares none. certbot --nginx then
#  rewrites this file IN PLACE and adds the 443 listen, the cert paths, the
#  options-ssl-nginx.conf include, ssl_dhparam, and a second server{} block
#  that redirects 80 -> 443.
#
#  NEVER write http2 on a listen line here (00-catch-all.conf already declares
#  it on 443 -> "protocol options redefined" warnings).
#  NEVER write default_server here (00-catch-all.conf owns it on all four
#  sockets -> a duplicate makes nginx REFUSE TO START and takes down the ~20
#  other production sites on this box).
#  NO includes, NO snippets, NO upstream {} block - everything inline.
#  ---------------------------------------------------------------------------
# =============================================================================

server {
    server_name api.babke.tn;

    access_log /var/log/nginx/api.babke.tn.access.log;
    error_log  /var/log/nginx/api.babke.tn.error.log;

    # -------------------------------------------------------------------------
    # Upload ceiling. Required here too: POST/PUT bodies carrying base64 image
    # data URIs hit /api/* directly. express.json is set to "10mb" and there is
    # no http-level client_max_body_size in /etc/nginx on this box, so the 1m
    # default would 413 them. 12M covers the ~33% inflation base64 adds.
    # -------------------------------------------------------------------------
    client_max_body_size 12M;

    # -------------------------------------------------------------------------
    # Compression. JSON list endpoints (menu, orders, gallery) are large.
    # text/event-stream is deliberately ABSENT from gzip_types: compressing an
    # SSE stream makes nginx buffer it and the stream dies.
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        application/json application/javascript text/css text/plain image/svg+xml;

    # -------------------------------------------------------------------------
    # Security headers. Server level only - a single add_header inside a
    # location would drop every inherited one.
    # X-Frame-Options DENY: an API response has no legitimate reason to be
    # framed anywhere, ever. Referrer-Policy no-referrer for the same reason.
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header Referrer-Policy           "no-referrer"       always;
    add_header Strict-Transport-Security "max-age=31536000"  always;
    add_header X-Frame-Options           "DENY"              always;

    # =========================================================================
    # SSE - public storefront stream.
    # Exact match (=) so it outranks the "location /api/" prefix below.
    # =========================================================================
    location = /api/sse {
        proxy_pass http://127.0.0.1:4050;

        # NON-NEGOTIABLE: nginx talks HTTP/1.0 upstream by default and sends
        # "Connection: close", which kills the stream after the first chunk.
        proxy_http_version 1.1;
        # EMPTY, not "upgrade" - SSE is plain HTTP/1.1, not a WebSocket upgrade.
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering            off;
        proxy_request_buffering    off;
        proxy_cache                off;
        gzip                       off;
        chunked_transfer_encoding  off;

        # 3600s matches a value already in use elsewhere on this box. The app
        # now emits a 25s heartbeat, so a stream is never idle anywhere near it.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        send_timeout        3600s;
    }

    # =========================================================================
    # SSE - admin dashboard stream. Gated by the admin_token cookie in the app.
    # =========================================================================
    location = /api/admin/events-stream {
        proxy_pass http://127.0.0.1:4050;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering            off;
        proxy_request_buffering    off;
        proxy_cache                off;
        gzip                       off;
        chunked_transfer_encoding  off;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        send_timeout        3600s;
    }

    # =========================================================================
    # The API surface. Prefix match, so /api/menu, /api/orders/<id>, etc.
    # =========================================================================
    location /api/ {
        proxy_pass http://127.0.0.1:4050;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # =========================================================================
    # Belt-and-braces source denies.
    # Redundant while "location /" below returns 404, but kept explicit so the
    # protection survives anyone who later relaxes the catch-all. Defence in
    # depth behind the code-level fix.
    # =========================================================================
    location ^~ /.git          { return 404; }   # also covers /.gitignore
    location ^~ /.env          { return 404; }
    location ^~ /node_modules/ { return 404; }
    location ~ ^/(server|seed|seed_and_check|build_check|check_events_now)\.js$ { return 404; }
    location ~ ^/(package|package-lock)\.json$                                  { return 404; }
    # /healthz reports mongoose readyState and process uptime. The container
    # HEALTHCHECK reaches it on 127.0.0.1:4000 inside the container, so it never
    # needs to be public.
    location = /healthz { return 404; }
    # CLI utility, not a browser script. Excluded from the image by
    # .dockerignore; denied here so the build is not the only gate.
    location ~* ^/scripts/mongo_runner.js$ { return 404; }
    # NOTE: no blanket dotfile deny on purpose - the certbot nginx authenticator
    # injects an exact-match "location = /.well-known/acme-challenge/<token>"
    # into this block during issuance and renewal. That exact match also
    # outranks the catch-all 404 below, so ACME still works on this host.

    # =========================================================================
    # Nothing else. The API host must never serve the SPA, the admin HTML or
    # repo source. Do NOT turn this into a proxy_pass.
    # =========================================================================
    location / { return 404; }
}
