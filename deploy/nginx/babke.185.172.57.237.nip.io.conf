# =============================================================================
#  Babke - LANDING vhost  (interim nip.io hostname)
#
#  install as : /etc/nginx/sites-available/babke-landing.nip.conf
#  symlink to : /etc/nginx/sites-enabled/babke-landing.nip.conf   (same basename)
#  serves     : the public storefront  ->  babke.185.172.57.237.nip.io
#  upstream   : the single babke app container, published on 127.0.0.1:4050 only
#
#  ROUTING DESIGN A
#  This vhost proxies the site AND /api/* to the same backend, so every one of
#  the frontend's root-relative fetches stays same-origin. There is no API_BASE
#  in the codebase, no CORS, no preflight. Do not "simplify" this by pointing
#  the frontend at the api host.
#
#  ---------------------------------------------------------------------------
#  !! THIS FILE IS PLAIN HTTP ON PURPOSE - DO NOT ADD TLS BY HAND !!
#
#  There is deliberately NO listen directive anywhere below; nginx implicitly
#  binds *:80 for a server block that declares none. certbot --nginx then
#  rewrites this file IN PLACE and adds, by itself:
#     listen 443 ssl;  ssl_certificate ...;  ssl_certificate_key ...;
#     include /etc/letsencrypt/options-ssl-nginx.conf;  ssl_dhparam ...;
#  plus a second server{} block that redirects 80 -> 443.
#  Pre-writing any of that breaks the installer and, on renewal, the reload.
#
#  NEVER write http2 on a listen line here. 00-catch-all.conf loads first
#  (alphabetically) and already declares "listen 443 ssl http2 default_server"
#  on both 0.0.0.0:443 and [::]:443; repeating it yields "protocol options
#  redefined" warnings on every reload.
#
#  NEVER write default_server here. 00-catch-all.conf owns it on all four
#  sockets. A duplicate makes nginx REFUSE TO START - which takes down the
#  ~20 other production sites sharing this box.
#
#  NO "include snippets/...", NO "include proxy_params;", NO upstream {} block.
#  Zero vhosts on this box use includes; everything is inline, on purpose.
#  ---------------------------------------------------------------------------
# =============================================================================

server {
    server_name babke.185.172.57.237.nip.io;

    access_log /var/log/nginx/babke-landing.nip.access.log;
    error_log  /var/log/nginx/babke-landing.nip.error.log;

    # -------------------------------------------------------------------------
    # Upload ceiling.
    # There is NO http-level client_max_body_size anywhere in /etc/nginx on this
    # box (verified), so the nginx default of 1m would otherwise apply. The app
    # sets express.json({ limit: "50mb" }) and every admin image upload is a
    # base64 data URI inside a JSON body. 60M covers the ~33% inflation base64
    # adds. Without this line EVERY image upload 413s on day one.
    # -------------------------------------------------------------------------
    client_max_body_size 12M;

    # -------------------------------------------------------------------------
    # Compression. The app ships no compression middleware and the JSON payloads
    # (menu, orders, gallery) are large.
    # text/event-stream is deliberately ABSENT from gzip_types: compressing an
    # SSE stream makes nginx buffer it and the stream dies.
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        application/json application/javascript text/css text/plain image/svg+xml;

    # -------------------------------------------------------------------------
    # Security headers.
    # Declared at SERVER level only, never inside a location. nginx add_header
    # inheritance is all-or-nothing: a single add_header inside a location drops
    # every inherited one. "always" keeps them on 301/404/5xx responses too.
    # HSTS is ignored by browsers over plain HTTP, so it is inert until certbot
    # runs. No includeSubDomains / preload: this host has sibling subdomains
    # whose TLS state we do not want to bind.
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000"                always;
    add_header X-Frame-Options           "SAMEORIGIN"                      always;

    # =========================================================================
    # SSE - public storefront stream.
    # scripts/app.js:818  ->  new EventSource('/api/sse')
    # Exact-match (=) locations win over the "location /" prefix below, so these
    # two blocks capture the streams no matter what else is defined.
    # =========================================================================
    location = /api/sse {
        proxy_pass http://127.0.0.1:4050;

        # NON-NEGOTIABLE: nginx talks HTTP/1.0 upstream by default and sends
        # "Connection: close", which kills the stream after the first chunk.
        proxy_http_version 1.1;
        # EMPTY, not "upgrade" - SSE is plain HTTP/1.1, not a WebSocket upgrade.
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering            off;
        proxy_request_buffering    off;
        proxy_cache                off;
        gzip                       off;
        chunked_transfer_encoding  off;

        # 3600s matches a value already in use elsewhere on this box. The app
        # now emits a 25s heartbeat, so a stream is never idle anywhere near it.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        send_timeout        3600s;
    }

    # =========================================================================
    # SSE - admin dashboard stream.
    # admin/admin.js:175  ->  new EventSource('/api/admin/events-stream')
    # Present on every vhost for uniformity; the app itself gates it on the
    # admin_token cookie and 401s without one.
    # =========================================================================
    location = /api/admin/events-stream {
        proxy_pass http://127.0.0.1:4050;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering            off;
        proxy_request_buffering    off;
        proxy_cache                off;
        gzip                       off;
        chunked_transfer_encoding  off;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        send_timeout        3600s;
    }

    # =========================================================================
    # The admin dashboard must NOT be reachable on the apex.
    # The auth cookie the app sets is host-only, so signing in here would mint a
    # second, invisible session that the admin host can neither see nor log out.

    # =========================================================================
    # Case-insensitive: nginx prefix locations are case-SENSITIVE on Linux, so
    # "^~ /admin/" alone let /Admin/ and /ADMIN/admin.js through to the app.
    # A regex location outranks the plain "location /" prefix below.
    location ~* ^/admin(/|$) { return 404; }

    # =========================================================================
    # Belt-and-braces source denies.
    # express.static(__dirname) serves the ENTIRE repo root, and the app
    # fallback route answers everything else with index.html. These are defence
    # in depth behind the code-level fix; keep them even after that lands.
    # =========================================================================
    location ^~ /.git          { return 404; }   # also covers /.gitignore
    location ^~ /.env          { return 404; }
    location ^~ /node_modules/ { return 404; }
    location ~ ^/(server|seed|seed_and_check|build_check|check_events_now)\.js$ { return 404; }
    location ~ ^/(package|package-lock)\.json$                                  { return 404; }
    # /healthz reports mongoose readyState and process uptime. The container
    # HEALTHCHECK reaches it on 127.0.0.1:4000 inside the container, so it never
    # needs to be public.
    location = /healthz { return 404; }
    # CLI utility, not a browser script. Excluded from the image by
    # .dockerignore; denied here so the build is not the only gate.
    location ~* ^/scripts/mongo_runner.js$ { return 404; }
    # NOTE: no blanket dotfile deny on purpose - the certbot nginx authenticator
    # injects an exact-match "location = /.well-known/acme-challenge/<token>"
    # into this block during issuance and renewal.

    # =========================================================================
    # Everything else: the storefront AND /api/* (Design A, same-origin).
    # =========================================================================
    location / {
        proxy_pass http://127.0.0.1:4050;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
