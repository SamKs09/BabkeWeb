# =============================================================================
#  Babke - ADMIN vhost  (interim nip.io hostname)
#
#  install as : /etc/nginx/sites-available/babke-admin.nip.conf
#  symlink to : /etc/nginx/sites-enabled/babke-admin.nip.conf   (same basename)
#  serves     : the admin SPA  ->  admin-babke.185.172.57.237.nip.io
#  upstream   : the single babke app container, published on 127.0.0.1:4050 only
#
#  ROUTING DESIGN A
#  This vhost proxies the SPA AND /api/* to the same backend, so every one of
#  the admin's root-relative fetches stays same-origin and the host-only
#  admin_token cookie is sent on all of them.
#
#  ---------------------------------------------------------------------------
#  !! THIS FILE IS PLAIN HTTP ON PURPOSE - DO NOT ADD TLS BY HAND !!
#
#  There is deliberately NO listen directive anywhere below; nginx implicitly
#  binds *:80 for a server block that declares none. certbot --nginx then
#  rewrites this file IN PLACE and adds the 443 listen, the cert paths, the
#  options-ssl-nginx.conf include, ssl_dhparam, and a second server{} block
#  that redirects 80 -> 443.
#
#  NEVER write http2 on a listen line here (00-catch-all.conf already declares
#  it on 443 -> "protocol options redefined" warnings).
#  NEVER write default_server here (00-catch-all.conf owns it on all four
#  sockets -> a duplicate makes nginx REFUSE TO START and takes down the ~20
#  other production sites on this box).
#  NO includes, NO snippets, NO upstream {} block - everything inline.
#  ---------------------------------------------------------------------------
# =============================================================================

server {
    server_name admin-babke.185.172.57.237.nip.io;

    access_log /var/log/nginx/babke-admin.nip.access.log;
    error_log  /var/log/nginx/babke-admin.nip.error.log;

    # -------------------------------------------------------------------------
    # Upload ceiling. This is the vhost that actually needs it: every admin
    # image upload is a base64 data URI inside a JSON body and express.json is
    # set to "50mb". No http-level client_max_body_size exists in /etc/nginx on
    # this box, so without this the 1m default 413s every upload.
    # 60M covers the ~33% inflation base64 adds.
    # -------------------------------------------------------------------------
    client_max_body_size 12M;

    # -------------------------------------------------------------------------
    # Compression. text/event-stream is deliberately ABSENT from gzip_types.
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        application/json application/javascript text/css text/plain image/svg+xml;

    # -------------------------------------------------------------------------
    # Security headers.
    # Server level only - a single add_header inside a location would drop every
    # inherited one. X-Robots-Tag lives here (not in a location) for that exact
    # reason: it must apply to the SPA, the 301 and the 404s alike.
    # SAMEORIGIN (not DENY) because the dashboard renders its own iframes.
    # Referrer-Policy same-origin so admin URLs never leak to third parties.
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header Referrer-Policy           "same-origin"        always;
    add_header Strict-Transport-Security "max-age=31536000"   always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header X-Robots-Tag              "noindex, nofollow"  always;

    # =========================================================================
    # Bare "/" MUST be a 301 to /admin/index.html. This is not cosmetic.
    #
    # admin/index.html mixes two kinds of asset path:
    #     ../styles/admin.css      ../config/settings.js      ../data/store.js
    # and one NON-prefixed script:
    #     <script defer src="admin.js">
    # A rewrite (or a proxy_pass to /admin/index.html) leaves the document URL
    # at "/", so "admin.js" resolves to /admin.js. The app catch-all answers
    # that with index.html, the browser refuses it on MIME grounds, and the SPA
    # silently never boots - no error banner, just a dead page.
    # The 301 changes the document URL to /admin/index.html, which preserves the
    # /admin/ directory context so ../ and bare relative paths both resolve.
    #
    # Exact match (=) so ONLY the bare root redirects; /admin/... is untouched.
    # =========================================================================
    location = / { return 301 /admin/index.html; }

    # =========================================================================
    # SSE - admin dashboard stream.
    # admin/admin.js:175  ->  new EventSource('/api/admin/events-stream')
    # =========================================================================
    location = /api/admin/events-stream {
        proxy_pass http://127.0.0.1:4050;

        # NON-NEGOTIABLE: nginx talks HTTP/1.0 upstream by default and sends
        # "Connection: close", which kills the stream after the first chunk.
        proxy_http_version 1.1;
        # EMPTY, not "upgrade" - SSE is plain HTTP/1.1, not a WebSocket upgrade.
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering            off;
        proxy_request_buffering    off;
        proxy_cache                off;
        gzip                       off;
        chunked_transfer_encoding  off;

        # 3600s matches a value already in use elsewhere on this box. The app
        # now emits a 25s heartbeat, so a stream is never idle anywhere near it.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        send_timeout        3600s;
    }

    # =========================================================================
    # SSE - public storefront stream. Present here too: the dashboard shares
    # components with the storefront and the stream is unauthenticated anyway.
    # =========================================================================
    location = /api/sse {
        proxy_pass http://127.0.0.1:4050;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering            off;
        proxy_request_buffering    off;
        proxy_cache                off;
        gzip                       off;
        chunked_transfer_encoding  off;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        send_timeout        3600s;
    }

    # =========================================================================
    # Belt-and-braces source denies.
    # express.static(__dirname) serves the ENTIRE repo root. Defence in depth
    # behind the code-level fix; keep them even after that lands.
    # =========================================================================
    location ^~ /.git          { return 404; }   # also covers /.gitignore
    location ^~ /.env          { return 404; }
    location ^~ /node_modules/ { return 404; }
    location ~ ^/(server|seed|seed_and_check|build_check|check_events_now)\.js$ { return 404; }
    location ~ ^/(package|package-lock)\.json$                                  { return 404; }
    # /healthz reports mongoose readyState and process uptime. The container
    # HEALTHCHECK reaches it on 127.0.0.1:4000 inside the container, so it never
    # needs to be public.
    location = /healthz { return 404; }
    # CLI utility, not a browser script. Excluded from the image by
    # .dockerignore; denied here so the build is not the only gate.
    location ~* ^/scripts/mongo_runner.js$ { return 404; }
    # NOTE: no blanket dotfile deny on purpose - the certbot nginx authenticator
    # injects an exact-match "location = /.well-known/acme-challenge/<token>"
    # into this block during issuance and renewal.

    # =========================================================================
    # Everything else: the admin SPA, its assets AND /api/* (Design A).
    # =========================================================================
    location / {
        proxy_pass http://127.0.0.1:4050;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
